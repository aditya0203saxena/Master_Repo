name: Generate Lockfile

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

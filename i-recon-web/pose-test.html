<!doctype html><html><body><video id="v" autoplay playsinline muted style="width:640px"></video><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js"></script><script>const v=document.getElementById('v'); navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(async s=>{v.srcObject=s; await v.play(); const p=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/${f}`}); p.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.6,minTrackingConfidence:.6}); p.onResults(r=>document.body.dataset.pose=r.poseLandmarks?'ok':'none'); await p.send({image:v});}).catch(e=>document.body.dataset.error=e.name||String(e));</script></body></html>
